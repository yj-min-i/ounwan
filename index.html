}

  --good:#4CD39A;--good-soft:#12372B;--bad:#FF8A8A;--bad-soft:#3B1D22;

  --accent:#7C97FF;--accent-ink:#0A0F20;--accent-soft:#1E2A5E;
  --gold:#F5B83D;--gold-ink:#F5B83D;--gold-soft:#3A2E10;

.q-row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;min-height:56px}

.q-row span.go{color:var(--accent);font-weight:700}
.notice{font-size:13px;color:var(--muted)}
.welcome{background:var(--accent-soft);border-radius:16px;padding:14px;color:var(--ink)}

.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.ex-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.ex-card b{font-size:16px}
.ex-card .tags{display:flex;gap:6px;flex-wrap:wrap}
details.guide summary{cursor:pointer;font-weight:700}
details.guide ul{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* log */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}

.heat .h.l3{background:var(--accent);color:var(--accent-ink)}
.heat .h.fut{opacity:.4}
.heat .hd{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px;margin-top:10px}
.badge{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--surface-2);min-width:0}
.badge .medal{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#1B1300;font-family:var(--font-display);font-size:16px}
.badge.lock{opacity:.55}.badge.lock .medal{background:var(--line);color:var(--muted)}
.badge b{display:block;font-size:13px;line-height:1.3}
.badge span{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.sess{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sess:last-child{border-bottom:0}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs{display:flex;gap:6px;max-width:720px;margin:0 auto}
.tab{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;min-height:52px;border-radius:12px}
.tab[aria-current="page"]{color:var(--accent)}
/* layers */
.layer{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#sheet{z-index:70}
.inner{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;flex:1}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.sheet h1{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.2}
.sec h3{font-size:15px;margin-bottom:10px}

.steps{list-style:none;counter-reset:s;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}

.sec.setup .steps li::before{background:var(--accent);color:var(--accent-ink)}
.bads{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bads li{background:var(--bad-soft);border-radius:12px;padding:10px 12px}
.rx{background:var(--gold-soft);border-radius:16px;padding:14px}

.bar{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}

.r-cue{max-width:34ch;color:var(--muted)}

.tring{width:min(72vw,260px);aspect-ratio:1;position:relative}

.ph-work{--c:var(--accent)}.ph-easy{--c:var(--c-cardio)}.ph-rest{--c:var(--muted)}
.r-actions{display:flex;flex-direction:column;gap:10px;width:100%}
.r-links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px;min-height:40px}
.confirm{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fin{align-items:center;text-align:center}
.fin .xp{font-family:var(--font-display);font-size:64px;color:var(--gold-ink);line-height:1.1}
.lvup{background:var(--gold-soft);color:var(--gold-ink);border-radius:16px;padding:12px 16px;font-weight:700;animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* diet · body */
.chklist{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface-2);border:0;border-radius:14px;padding:12px;cursor:pointer;min-height:56px}
.chk i{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--accent-ink)}

.chk b{display:block}

.bt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:420px}
.bt th,.bt td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}

.dl-good{color:var(--good)}.dl-bad{color:var(--bad)}.dl-neu{color:var(--muted)}
.fi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fi label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fi input{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;width:100%}

async function pushRemote(){
  if(!remoteDoc)return;

  remoteBusy=true;

function mergeStates(a,b){
  const m=new Map();
  [].concat(a.sessions||[],b.sessions||[]).forEach(s=>{if(s&&s.id)m.set(s.id,s);});
  const base=(a.updatedAt||0)>=(b.updatedAt||0)?a:b,other=base===a?b:a;
  const meals={};
  [other.meals||{},base.meals||{}].forEach(src=>Object.keys(src).forEach(k=>{meals[k]=[...new Set([...(meals[k]||[]),...(src[k]||[])])];}));
  const bm=new Map();
  [...(other.body||[]),...(base.body||[])].forEach(x=>{if(x&&x.d)bm.set(x.d,x);});
  return {v:1,goal:base.goal||3,place:base.place||"home",sound:base.sound!==false,sessions:[...m.values()].sort((x,y)=>x.t-y.t),meals:meals,body:[...bm.values()].sort((x,y)=>x.d<y.d?-1:1),updatedAt:Math.max(a.updatedAt||0,b.updatedAt||0)};
}
async function initRemote(){
  try{

    const res=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    const db=res[0],user=res[1];
    if(!db||!user)return;
    const id=await user.id();
    if(!id)return;
    const doc=db.doc("data/users/"+id+"/state");
    const snap=await doc.get();
    remoteDoc=doc;
    if(!snap.exists){if(state.sessions.length)pushRemote();}
    else{
      const remote=snap.data();
      const merged=mergeStates(state,remote);
      const remoteIds=new Set((remote.sessions||[]).map(s=>s.id));
      const needPush=merged.sessions.some(s=>!remoteIds.has(s.id));
      state=merged;
      try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
      if(!R&&tab!=="lib")render();
      if(needPush)pushRemote();
    }
    if(!R&&tab==="log")render();
  }catch(e){}
}

const TITLES=["소파 탈출자","운동화 끈 묶는 사람","첫 땀방울","습관 새싹","꾸준한 사람","근육 새싹","체력 충전 중","자세 요정","헬스장 단골","오운완 장인"];
const STARTS=[0,100,250,450,700,1000,1400,1900,2500,3200];
const startOf=n=>n<=10?STARTS[n-1]:3200+(n-10)*800;
function levelOf(xp){
  let n=1;while(xp>=startOf(n+1))n++;
  return {n:n,cur:xp-startOf(n),need:startOf(n+1)-startOf(n),title:TITLES[Math.min(n,10)-1],next:TITLES[Math.min(n+1,10)-1]};
}
function weekMeet(sessions){
  const m=new Map();
  sessions.forEach(s=>{const k=ymd(mondayOf(parseYmd(s.date)));if(!m.has(k))m.set(k,new Set());m.get(k).add(s.date);});
  return m;
}
function weekStreak(st){
  const m=weekMeet(st.sessions);
  const met=d=>(m.get(ymd(d))||new Set()).size>=st.goal;
  let k=mondayOf(new Date()),n=0;
  if(met(k))n++;
  k=addDays(k,-7);
  while(met(k)){n++;k=addDays(k,-7);}
  return n;
}
function maxWeekStreak(st){
  const m=weekMeet(st.sessions);
  const keys=[...m.keys()].filter(k=>m.get(k).size>=st.goal).sort();
  let best=0,cur=0,prev=null;
  keys.forEach(k=>{cur=(prev&&ymd(addDays(parseYmd(prev),7))===k)?cur+1:1;best=Math.max(best,cur);prev=k;});
  return best;
}
function calc(st){
  const S=st.sessions;
  const sum=f=>S.reduce((a,s)=>a+(s[f]||0),0);
  const cats={},exs=new Set();
  S.forEach(s=>{(s.cats||[]).forEach(c=>{const k=c==="shape"?"strength":c;cats[k]=(cats[k]||0)+1;});(s.ex||[]).forEach(x=>exs.add(x));});
  const meals=st.meals||{};let dietXp=0,mealDays=0;
  Object.keys(meals).forEach(k=>{const n=(meals[k]||[]).length;dietXp+=n*5;if(n>=5)mealDays++;});
  const xp=sum("xp")+dietXp;
  return {n:S.length,days:new Set(S.map(s=>s.date)).size,xp:xp,mealDays:mealDays,mins:sum("mins"),sets:sum("sets"),cats:cats,exs:exs,maxWk:maxWeekStreak(st),lv:levelOf(xp).n};
}

function itemSecs(it){
  if(it.phases)return it.phases.reduce((a,p)=>a+p.s,0);
  if(it.sets)return it.sets*((it.secs||((it.reps||10)*3))+(it.rest!=null?it.rest:45));
  return it.secs||0;
}
const estMin=rt=>Math.max(1,Math.round(rt.items.reduce((a,it)=>a+itemSecs(it),0)/60));
function itemTarget(it){
  if(it.phases)return "인터벌 "+Math.round(itemSecs(it)/60)+"분";
  if(!it.sets)return (it.label?it.label+" ":"")+Math.round(it.secs/60)+"분";
  return it.sets+"세트 × "+(it.label||(it.secs?it.secs+"초":it.reps+"회"));
}
function buildSteps(rt){
  const steps=[];
  rt.items.forEach((it,ii)=>{
    if(it.phases){steps.push({type:"interval",ex:it.ex,item:ii,phases:it.phases,hint:it.hint,label:it.label});}
    else if(!it.sets){steps.push({type:"steady",ex:it.ex,item:ii,secs:it.secs,label:it.label});}
    else{for(let s=1;s<=it.sets;s++)steps.push({type:it.secs?"hold":"reps",ex:it.ex,item:ii,set:s,sets:it.sets,reps:it.reps,secs:it.secs,label:it.label,mid:!!it.mid,rest:it.rest!=null?it.rest:45});}
  });
  return steps;
}
const stepSecs=s=>s.type==="interval"?s.phases.reduce((a,p)=>a+p.s,0):(s.secs||0);
function targetOf(s){
  if(s.type==="reps")return s.label||(s.reps+"회");
  if(s.type==="hold")return s.label||(s.secs+"초");
  return Math.round(stepSecs(s)/60)+"분";
}

function chipRow(key,opts){return opts.map(o=>'<button class="chip" data-act="filt" data-k="'+key+'" data-v="'+o[0]+'" aria-pressed="'+(lib[key]===o[0])+'">'+o[1]+'</button>').join("");}

/* ---- 기록 ---- */
function renderLog(){
  const S=calc(state),streak=weekStreak(state),now=new Date(),todayKey=ymd(now);
  const counts={};state.sessions.forEach(s=>{counts[s.date]=(counts[s.date]||0)+1;});
  const start=addDays(mondayOf(now),-28);let cells="";
  ["월","화","수","목","금","토","일"].forEach(d=>{cells+='<div class="hd">'+d+'</div>';});
  for(let i=0;i<35;i++){const d=addDays(start,i),k=ymd(d),c=counts[k]||0;cells+='<div class="h'+(c?" l"+Math.min(c,3):"")+(k>todayKey?" fut":"")+'" title="'+k+'">'+d.getDate()+'</div>';}
  const earned=new Set(badgeIds(S));
  const badges=BADGES.map(b=>'<div class="badge'+(earned.has(b.id)?"":" lock")+'"><div class="medal">'+b.mark+'</div><div><b>'+b.name+'</b><span>'+b.desc+'</span></div></div>').join("");
  const days=["일","월","화","수","목","금","토"];
  const recent=state.sessions.slice(-6).reverse().map(s=>{const d=parseYmd(s.date);return '<div class="sess"><span><b>'+s.name+'</b><br><span class="muted small">'+(d.getMonth()+1)+'/'+d.getDate()+' ('+days[d.getDay()]+') · '+s.mins+'분'+(s.partial?' · 중간까지':'')+'</span></span><span class="pill" style="align-self:center">+'+s.xp+' XP</span></div>';}).join("")||'<p class="muted">아직 기록이 없어요. 오늘 첫 퀘스트를 해볼까요?</p>';
  view().innerHTML=
   '<header class="pg-head"><h1>기록</h1><p>쌓인 만큼 보여요.</p></header>'+
   '<div class="tiles"><div class="tile"><b>'+S.n+'</b><span>운동 횟수</span></div><div class="tile"><b>'+S.mins+'</b><span>운동 시간(분)</span></div><div class="tile"><b>'+S.xp+'</b><span>누적 XP</span></div><div class="tile"><b>'+streak+'</b><span>연속 달성 주</span></div></div>'+
   bodyCard()+
   '<section class="card"><h2>최근 5주</h2><div class="heat">'+cells+'</div></section>'+
   '<section class="card"><h2>배지 '+earned.size+' / '+BADGES.length+'</h2><div class="badges">'+badges+'</div></section>'+
   '<section class="card"><h2>최근 운동</h2><div style="margin-top:6px">'+recent+'</div></section>'+
   '<section class="card"><h2>설정</h2><div class="row between" style="margin-top:10px"><span>주간 목표</span><div class="seg" role="group" aria-label="주간 목표">'+[2,3,4,5].map(n=>'<button data-act="goal" data-v="'+n+'" aria-pressed="'+(state.goal===n)+'">주 '+n+'일</button>').join("")+'</div></div>'+
   '<div class="row between" style="margin-top:12px"><span>소리·진동 알림</span><div class="seg" role="group" aria-label="소리"><button data-act="sound" data-v="1" aria-pressed="'+state.sound+'">켜기</button><button data-act="sound" data-v="0" aria-pressed="'+!state.sound+'">끄기</button></div></div>'+
   '<p class="notice" style="margin-top:12px">'+(remoteDoc?'기록은 이 기기와 계정에 함께 저장돼요.':'기록은 이 브라우저에만 저장돼요.')+'</p>'+
   (confirmReset?'<div class="confirm" style="margin-top:12px"><b>기록을 모두 지울까요?</b><span class="muted small">되돌릴 수 없어요.</span><div class="row"><button class="btn danger" data-act="reset-yes">모두 지우기</button><button class="btn ghost" data-act="reset-no">취소</button></div></div>':'<button class="btn ghost" style="margin-top:12px" data-act="reset-ask">기록 초기화</button>')+'</section>';
}

/* ---- 몸 변화 기록 ---- */
let bodyDelArm=null;
const bodyList=()=>(state.body||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
const latestBody=()=>{const l=bodyList();return l.length?l[l.length-1]:null;};
function dlt(cur,prev,goodDir){
  if(prev==null)return "";
  const d=Math.round((cur-prev)*10)/10;
  if(d===0)return ' <small class="dl-neu">±0</small>';
  const cls=goodDir===0?"dl-neu":((d>0)===(goodDir>0)?"dl-good":"dl-bad");
  return ' <small class="'+cls+'">'+(d>0?"+":"")+d.toFixed(1)+'</small>';
}
function bodyCard(){
  const l=bodyList();
  const rows=l.map((x,i)=>{
    const p=i>0?l[i-1]:null;
    const del=bodyDelArm===x.d?'<button class="link" data-act="body-del" data-d="'+x.d+'">한 번 더 누르면 삭제</button>':'<button class="link" data-act="body-del" data-d="'+x.d+'" aria-label="기록 삭제">삭제</button>';
    return '<tr><td>'+x.d.slice(2).replace(/-/g,".")+'</td><td>'+x.w.toFixed(1)+dlt(x.w,p&&p.w,0)+'</td><td>'+x.m.toFixed(1)+dlt(x.m,p&&p.m,1)+'</td><td>'+x.f.toFixed(1)+dlt(x.f,p&&p.f,-1)+'</td><td>'+del+'</td></tr>';
  }).join("");
  return '<section class="card"><h2>몸 변화 (인바디)</h2>'+
   '<p class="notice" style="margin:6px 0 10px">목표 방향은 골격근량은 올리고, 체지방률은 내리고, 체중은 유지하거나 조금 늘리는 거예요. 체중이 줄어드는 게 목표가 아니에요. 같은 조건(시간대, 식사 후 경과)으로 4~8주에 한 번 재요.</p>'+
   '<div style="overflow-x:auto"><table class="bt"><thead><tr><th>날짜</th><th>체중 kg</th><th>골격근량 kg</th><th>체지방률 %</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="5" class="muted">아직 기록이 없어요.</td></tr>')+'</tbody></table></div>'+
   '<h3 style="font-size:14px;margin:14px 0 8px">새 기록 추가</h3><div class="fi">'+
   '<label>날짜<input id="bd-date" type="date" value="'+ymd(new Date())+'"></label>'+
   '<label>체중 (kg)<input id="bd-w" type="number" step="0.1" inputmode="decimal"></label>'+
   '<label>골격근량 (kg)<input id="bd-m" type="number" step="0.1" inputmode="decimal"></label>'+
   '<label>체지방률 (%)<input id="bd-f" type="number" step="0.1" inputmode="decimal"></label></div>'+
   '<div class="row" style="margin-top:10px"><button class="btn primary" data-act="body-add">기록 추가</button><span id="bdMsg" class="small muted" role="status"></span></div></section>';
}

   '<section class="card"><div class="row between"><h2>오늘 챙겨 먹기</h2><span class="pill good">'+on.size+' / 5</span></div><p class="notice" style="margin:6px 0 10px">체크할 때마다 +5 XP예요. 못 챙긴 날의 벌점은 없어요.</p><div class="chklist">'+checks+'</div></section>'+
   '<section class="card"><h2>단백질은 얼마나?</h2><p style="margin-top:6px">근력운동을 하는 사람에게 흔히 쓰이는 범위는 체중 1kg당 하루 약 1.4~2.0g이에요. '+prot+'</p><p class="muted small" style="margin-top:6px">한 끼에 20~40g 정도로 나눠 먹는 것이 권장된다고 알려져 있어요(국제스포츠영양학회 입장문을 다룬 기사 기준). 내 몸에 맞는 정확한 양은 영양사나 의사와 정하세요.</p></section>'+

   '<section class="card"><h2>이건 피해요</h2><ul class="dl"><li>끼니를 거르거나 양을 줄여 체중을 빼려는 것. 이 앱의 목표는 체중 감소가 아니에요.</li><li>단백질만 챙기고 밥은 줄이는 것. 에너지가 부족하면 근육이 늘기 어려워요.</li></ul></section>'+
   '<p class="notice">식사가 부담되거나 체중에 대한 생각이 자꾸 커진다면 학교 보건센터나 병원에서 영양·건강 상담이 가능한지 문의해 보세요. 이 내용은 일반 정보이며 개인 진단이나 처방이 아니에요.</p>';

/* ---- 식단 · 몸 기록 이벤트 ---- */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act;
  if(a==="meal"){
    const k=ymd(new Date());state.meals=state.meals||{};
    const s=new Set(state.meals[k]||[]),i=+t.dataset.i;
    if(s.has(i))s.delete(i);else s.add(i);
    state.meals[k]=[...s].sort();
    if(!state.meals[k].length)delete state.meals[k];
    persist();renderDiet();
  }else if(a==="body-add"){
    const g=id=>document.getElementById(id),msg=document.getElementById("bdMsg");
    const d=g("bd-date").value,w=parseFloat(g("bd-w").value),m=parseFloat(g("bd-m").value),f=parseFloat(g("bd-f").value);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){msg.textContent="날짜를 선택해 주세요.";return;}
    if(!(w>=25&&w<=150)||!(m>=5&&m<=70)||!(f>=3&&f<=60)){msg.textContent="숫자를 확인해 주세요. 체중 25~150, 골격근량 5~70, 체지방률 3~60.";return;}
    state.body=(state.body||[]).filter(x=>x.d!==d).concat([{d:d,w:w,m:m,f:f}]);
    persist();renderLog();
  }else if(a==="body-del"){
    const d=t.dataset.d;
    if(bodyDelArm!==d){bodyDelArm=d;renderLog();return;}
    bodyDelArm=null;state.body=(state.body||[]).filter(x=>x.d!==d);persist();renderLog();
  }
});

/* ---- 러너: 소리 · 화면 유지 · 타이머 ---- */
let actx=null,wake=null,tickId=null;
function beep(f,d){
  if(!state.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();
    const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f||880;g.gain.value=0.08;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+(d||140)/1000);}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(60);}catch(e){}
}
async function lockScreen(){try{if(navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null;});}}catch(e){}}
function unlockScreen(){try{if(wake)wake.release();}catch(e){}wake=null;}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&R&&R.mode!=="finished")lockScreen();});
const startTick=()=>{if(!tickId)tickId=setInterval(tick,250);};
const stopTick=()=>{clearInterval(tickId);tickId=null;};
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+pad(s%60);};
const curStep=()=>R.steps[R.i];
const elapsed=()=>R.acc+(R.t0?Date.now()-R.t0:0);
function resetTimed(){R.acc=0;R.t0=null;R.phase=-1;R.midDone=false;}
function phaseAt(s,el){
  let acc=0;
  for(let i=0;i<s.phases.length;i++){const d=s.phases[i].s*1000;if(el<acc+d)return {i:i,start:acc,len:d};acc+=d;}
  const l=s.phases.length-1;return {i:l,start:acc-s.phases[l].s*1000,len:s.phases[l].s*1000};
}

/* ---- 러너: 흐름 ---- */
function openRunner(rt){
  R={rt:rt,steps:buildSteps(rt),i:0,mode:"ready",xp:0,sets:0,done:0,start:Date.now(),exs:new Set(),cats:new Set(),acc:0,t0:null,phase:-1,midDone:false,restEnd:0,restTotal:0,confirm:false,sum:null};
  $("#runner").hidden=false;document.body.classList.add("lock");lockScreen();renderRunner();
}
function closeRunner(){stopTick();unlockScreen();R=null;$("#runner").hidden=true;$("#sheet").hidden=true;document.body.classList.remove("lock");render();}
function startTimed(){R.mode="running";resetTimed();R.t0=Date.now();beep(880,120);renderRunner();startTick();}
function pauseTimed(){R.acc=elapsed();R.t0=null;R.mode="paused";renderRunner();}
function resumeTimed(){R.t0=Date.now();R.mode="running";renderRunner();}
function nextStep(){R.i++;R.mode="ready";resetTimed();}
function completeStep(){
  const s=curStep(),e=EXM[s.ex];
  if(s.type==="reps"||s.type==="hold"){R.xp+=10;R.sets++;}else{R.xp+=Math.max(4,Math.round(stepSecs(s)/60*4));}
  R.done++;R.exs.add(s.ex);R.cats.add(e.cat);resetTimed();
  if(R.i>=R.steps.length-1){finish(false);return;}
  if((s.type==="reps"||s.type==="hold")&&s.rest>0){R.mode="rest";R.restTotal=s.rest*1000;R.restEnd=Date.now()+R.restTotal;startTick();}
  else{nextStep();}
  renderRunner();
}
function skipEx(){
  const s=curStep();let j=R.i;
  while(j<R.steps.length&&R.steps[j].item===s.item)j++;
  resetTimed();
  if(j>=R.steps.length){if(R.done>0)finish(false);else closeRunner();return;}
  R.i=j;R.mode="ready";renderRunner();
}
function finish(partial){
  stopTick();unlockScreen();
  const before=calc(state),bLv=levelOf(before.xp),bBadges=new Set(badgeIds(before));
  const now=new Date(),today=ymd(now);
  const wk=weekMeet(state.sessions).get(ymd(mondayOf(now)))||new Set();
  const daysBefore=wk.size,daysAfter=wk.has(today)?daysBefore:daysBefore+1;
  const wkBonus=(daysBefore<state.goal&&daysAfter>=state.goal)?50:0;
  const bonus=partial?0:30,xp=R.xp+bonus+wkBonus;
  const sess={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:Date.now(),date:today,rid:R.rt.id,name:R.rt.name,xp:xp,sets:R.sets,mins:Math.max(1,Math.round((Date.now()-R.start)/60000)),ex:[...R.exs],cats:[...R.cats],partial:!!partial};
  state.sessions.push(sess);persist();
  const after=calc(state),aLv=levelOf(after.xp);
  R.sum={xp:xp,bonus:bonus,wkBonus:wkBonus,bLv:bLv,aLv:aLv,badges:BADGES.filter(b=>b.test(after)&&!bBadges.has(b.id)),mins:sess.mins,sets:sess.sets,wkDays:daysAfter,partial:!!partial,praise:pick(partial?PRAISE_PART:PRAISE)};
  R.mode="finished";renderRunner();render();
}
function tick(){
  if(!R)return;
  if(R.mode==="running"){
    const s=curStep(),el=elapsed(),tot=stepSecs(s)*1000;
    if(el>=tot){beep(1046,300);completeStep();return;}
    if(s.type==="interval"){const p=phaseAt(s,el);if(p.i!==R.phase){if(R.phase>=0)beep(p.i%2?660:880,200);R.phase=p.i;renderRunner();return;}}
    if(s.mid&&!R.midDone&&el>=tot/2){R.midDone=true;beep(988,250);const h=$("#midHint");if(h)h.textContent="반대쪽으로 바꿔요";}
    updateTime(s,el,tot);
  }else if(R.mode==="rest"){
    const rem=R.restEnd-Date.now();
    if(rem<=0){beep(988,250);nextStep();renderRunner();return;}
    setTime(fmt(rem),"휴식 중",1-rem/R.restTotal);
  }
}
const RC=2*Math.PI*96;
function setTime(txt,sub,frac){
  const n=$("#tNum"),r=$("#tRing"),sb=$("#tSub");
  if(n)n.textContent=txt;if(sb)sb.textContent=sub;if(r)r.setAttribute("stroke-dashoffset",(RC*Math.min(1,Math.max(0,frac))).toFixed(1));
}
function updateTime(s,el,tot){
  if(s.type==="interval"){const p=phaseAt(s,el),pe=el-p.start;setTime(fmt(p.len-pe),"전체 "+fmt(tot-el)+" 남음",pe/p.len);}
  else setTime(fmt(tot-el),"남은 시간",el/tot);
}

/* ---- 러너: 화면 ---- */
function ringHTML(){return '<div class="tring"><svg viewBox="0 0 220 220"><circle class="bg" cx="110" cy="110" r="96"/><circle id="tRing" class="fg" cx="110" cy="110" r="96" stroke-dasharray="'+RC.toFixed(1)+'" stroke-dashoffset="0" transform="rotate(-90 110 110)"/></svg><div class="in"><b id="tNum">0:00</b><small id="tSub"></small></div></div>';}
function finishHTML(){
  const m=R.sum,up=m.aLv.n>m.bLv.n;
  return '<div class="inner fin" style="justify-content:center">'+
   '<h1 class="pg-head" style="font-family:var(--font-display);font-weight:400;font-size:30px">'+(m.partial?'여기까지 기록했어요':'오늘도 해냈어요')+'</h1>'+
   '<div class="xp" id="xpNum">+0</div><div class="muted">XP 획득'+(m.bonus?' · 완주 보너스 +'+m.bonus:'')+(m.wkBonus?' · 주간 목표 보너스 +'+m.wkBonus:'')+'</div>'+
   (up?'<div class="lvup">레벨 '+m.aLv.n+' 달성 · '+m.aLv.title+'</div>':'<div class="muted">레벨 '+m.aLv.n+' · '+m.aLv.cur+' / '+m.aLv.need+' XP</div>')+
   m.badges.map(b=>'<div class="badge" style="min-width:220px"><div class="medal">'+b.mark+'</div><div style="text-align:left"><b>새 배지 · '+b.name+'</b><span>'+b.desc+'</span></div></div>').join("")+
   '<p>'+m.praise+'</p><p class="muted small">운동 시간 '+m.mins+'분 · '+m.sets+'세트 · 이번 주 '+m.wkDays+' / '+state.goal+'일</p>'+
   '<div class="r-actions"><button class="btn primary big" data-act="r-home">홈으로</button><button class="btn ghost" data-act="r-log">기록 보기</button></div></div>';
}
function renderRunner(){
  const el=$("#runner");
  if(!R){el.hidden=true;return;}
  if(R.mode==="finished"){
    el.innerHTML=finishHTML();
    const n=$("#xpNum"),target=R.sum.xp;
    if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches){n.textContent="+"+target;}
    else{const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900);n.textContent="+"+Math.round(target*p);if(p<1)requestAnimationFrame(f);})(t0);}
    return;
  }
  const s=curStep(),e=EXM[s.ex],total=R.steps.length;
  const head='<div class="r-head"><button class="icon-btn" data-act="r-quit" aria-label="그만하기">'+XICON+'</button><div class="r-prog"><div class="bar"><i style="width:'+Math.round(R.i/total*100)+'%"></i></div><span>'+(R.i+1)+'/'+total+'</span></div><button class="icon-btn" data-act="r-sound" aria-label="소리 켜고 끄기">'+(state.sound?SND_ON:SND_OFF)+'</button></div>';
  let body="";
  if(R.confirm){
    body='<div class="r-main"><div class="confirm" style="width:100%"><b>운동을 그만할까요?</b><span class="muted small">'+(R.done>0?'지금까지 한 '+R.done+'개는 기록에 남길 수 있어요.':'아직 완료한 동작이 없어요.')+'</span>'+(R.done>0?'<button class="btn primary" data-act="r-quit-save">여기까지 기록하고 끝내기</button>':'')+'<button class="btn danger" data-act="r-quit-discard">기록 없이 나가기</button><button class="btn ghost" data-act="r-continue">계속하기</button></div></div>';
  }else if(R.mode==="rest"){
    body='<div class="r-main cat-'+e.cat+'"><span class="pill plain">휴식</span>'+ringHTML()+'<div class="r-actions"><button class="btn big" data-act="r-add15">+15초</button><button class="btn primary big" data-act="r-skiprest">바로 다음으로</button></div>'+nextHTML()+'</div>';
  }else{
    const timed=s.type!=="reps",ph=(s.type==="interval"&&R.mode!=="ready")?s.phases[Math.max(0,R.phase)]:null;
    let center;
    if(R.mode==="ready"||!timed){
      center='<div class="r-target">'+targetOf(s)+'</div>'+(s.hint?'<p class="muted small">'+s.hint+'</p>':'');
    }else{
      center=(ph?'<div class="r-name ph-'+ph.k+'" style="color:var(--c)">'+ph.l+'</div>':'')+ringHTML()+(s.mid?'<p id="midHint" class="muted">'+(R.midDone?'반대쪽으로 바꿔요':'한쪽 30초 후 알려드려요')+'</p>':'');
    }
    let btn;
    if(R.mode==="ready")btn=timed?'<button class="btn primary big" data-act="r-start">시작</button>':'<button class="btn primary big" data-act="r-complete">세트 완료</button>';
    else if(R.mode==="running")btn='<button class="btn big" data-act="r-pause">일시정지</button>';
    else btn='<button class="btn primary big" data-act="r-resume">다시 시작</button>';
    body='<div class="r-main cat-'+e.cat+(ph?' ph-'+ph.k:'')+'"><span class="pill">'+CATS[e.cat].name+'</span><h2 class="r-name">'+e.name+'</h2>'+
     (s.label&&s.type==="steady"?'<div class="muted">'+s.label+'</div>':'')+(s.sets?'<div class="muted">세트 '+s.set+' / '+s.sets+'</div>':'')+
     center+(R.mode==="ready"?'<p class="r-cue">'+e.cue+'</p>':'')+
     '<div class="r-actions">'+btn+'</div><div class="r-links"><button class="link" data-act="r-detail" data-ex="'+e.id+'">동작 설명 보기</button><button class="link" data-act="r-skip">이 동작 건너뛰기</button></div>'+nextHTML()+'</div>';
  }
  el.innerHTML='<div class="inner">'+head+body+'</div>';
  if(R.mode==="running"||R.mode==="paused"){const st=curStep();updateTime(st,elapsed(),stepSecs(st)*1000);}
  if(R.mode==="rest")setTime(fmt(R.restEnd-Date.now()),"휴식 중",1-(R.restEnd-Date.now())/R.restTotal);
}
function nextHTML(){
  const idx=R.mode==="rest"?R.i+1:R.i+1,n=R.steps[idx];
  if(!n)return '<div class="r-next">마지막 동작이에요</div>';
  return '<div class="r-next">다음: '+EXM[n.ex].name+' '+(n.set?'세트 '+n.set+'/'+n.sets:targetOf(n))+'</div>';
}

/* ---- 이벤트 ---- */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act;
  switch(a){
    case "tab":setTab(t.dataset.tab);break;
    case "start":openRunner(RM[t.dataset.r]);break;
    case "shuffle":questOffset++;renderToday();break;
    case "place":state.place=t.dataset.v;questOffset=0;persist();renderToday();break;
    case "filt":lib[t.dataset.k]=t.dataset.v;renderLibFilters();break;
    case "detail":openDetail(t.dataset.ex,false);break;
    case "r-detail":openDetail(t.dataset.ex,true);break;
    case "close-detail":closeDetail();break;
    case "quick":closeDetail();openRunner(quickRoutine(EXM[t.dataset.ex]));break;
    case "goal":state.goal=+t.dataset.v;persist();renderLog();break;
    case "sound":state.sound=t.dataset.v==="1";persist();renderLog();break;
    case "reset-ask":confirmReset=true;renderLog();break;
    case "reset-no":confirmReset=false;renderLog();break;
    case "reset-yes":state.sessions=[];confirmReset=false;persist();renderLog();break;
    case "r-complete":completeStep();break;
    case "r-start":startTimed();break;
    case "r-pause":pauseTimed();break;
    case "r-resume":resumeTimed();break;
    case "r-add15":R.restEnd+=15000;R.restTotal+=15000;break;
    case "r-skiprest":nextStep();renderRunner();break;
    case "r-skip":skipEx();break;
    case "r-sound":state.sound=!state.sound;persist();renderRunner();break;
    case "r-quit":R.confirm=true;renderRunner();break;
    case "r-continue":R.confirm=false;renderRunner();break;
    case "r-quit-save":finish(true);break;
    case "r-quit-discard":closeRunner();break;
    case "r-home":closeRunner();setTab("today");break;
    case "r-log":closeRunner();setTab("log");break;
  }
});
document.addEventListener("input",ev=>{
  if(ev.target.id==="libQ"){lib.q=ev.target.value.trim().toLowerCase();renderLibFilters();}
});

/* ---- 시작 ---- */
render();
initRemote();


if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script></body></html>
